<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>זית ודבש · CRM וסוכן מכירות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: customer chat (start side) beside the live CRM (pipeline + selected deal); stacks on phones. */
:root {
  --bg: #f3f4ef; --surface: #fff; --ink: #23291f; --muted: #677061; --line: #dcdfd4;
  --olive: #4c5a2f; --olive-soft: #e7ebdc; --honey: #c98a12; --honey-soft: #fbefd6;
  --ok: #2f7d4f; --ok-soft: #e3f2e8; --warn: #b7791f; --warn-soft: #fbf0dc; --bad: #b23b3b; --bad-soft: #f8e3e3;
  --display: "Frank Ruhl Libre", Georgia, serif; --body: "Assistant", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161a13; --surface: #1f241b; --ink: #e9ecdf; --muted: #a2aa96; --line: #343b2c;
  --olive: #b5c58a; --olive-soft: #2b3322; --honey: #e7a93a; --honey-soft: #3a2f17;
  --ok: #6cc28f; --warn: #e3ad55; --bad: #ec7d7d; --ok-soft: #1d3326; --warn-soft: #3a2f17; --bad-soft: #3d2222; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #161a13; --surface: #1f241b; --ink: #e9ecdf; --muted: #a2aa96; --line: #343b2c;
  --olive: #b5c58a; --olive-soft: #2b3322; --honey: #e7a93a; --honey-soft: #3a2f17;
  --ok: #6cc28f; --warn: #e3ad55; --bad: #ec7d7d; --ok-soft: #1d3326; --warn-soft: #3a2f17; --bad-soft: #3d2222; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.2; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px clamp(14px, 3vw, 32px); background: var(--surface); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 1.4rem; color: var(--olive); }
.top p { margin: 0; color: var(--muted); font-size: .9rem; }
.ghost { border: 1px solid var(--line); background: var(--surface); color: var(--olive); border-radius: 8px; padding: 5px 11px; font-weight: 600; font-size: .85rem; }
.primary { border: 0; background: var(--olive); color: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 700; }
.primary:disabled { opacity: .55; cursor: progress; }
.wrap { display: grid; grid-template-columns: 380px 1fr; gap: 18px; padding: 18px clamp(14px, 3vw, 32px) 40px; max-width: 1500px; margin: 0 auto; align-items: start; }
@media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } }

/* chat */
.phone { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; position: sticky; top: 12px; }
.phone header { background: var(--olive); color: var(--surface); padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; }
.phone header b { display: block; } .phone header span { font-size: .8rem; opacity: .85; }
.msgs { height: 470px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--olive); color: var(--surface); border-end-end-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-end-start-radius: 4px; }
.msg.human { border-color: var(--honey); background: var(--honey-soft); }
.msg .who { display: block; font-size: .72rem; color: var(--muted); font-weight: 700; }
.tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.tools span { font-size: .7rem; background: var(--olive-soft); color: var(--olive); border-radius: 99px; padding: 0 7px; }
.tools span.err { background: var(--bad-soft); color: var(--bad); }
.typing { color: var(--muted); font-style: italic; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px 0; }
.chips button { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: .8rem; }
.send { display: flex; gap: 6px; padding: 10px; }
.send input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
.status { font-size: .82rem; color: var(--muted); padding: 0 12px 10px; margin: 0; }

/* crm */
.crm { display: grid; gap: 14px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; }
.kpi span { font-size: .8rem; color: var(--muted); }
.kpi b { font-family: var(--display); font-size: 1.4rem; color: var(--olive); font-variant-numeric: tabular-nums; }
.kpi.alert b { color: var(--bad); }
.board { display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.col { background: color-mix(in srgb, var(--st) 8%, var(--bg)); border-top: 3px solid var(--st); border-radius: 10px; padding: 8px; display: grid; gap: 6px; align-content: start; min-height: 170px; }
.col h3 { font-family: var(--body); font-size: .85rem; display: flex; justify-content: space-between; }
.col h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.s-new { --st: #8a9580; } .s-contacted { --st: #4f7cac; } .s-quoted { --st: #c98a12; } .s-negotiation { --st: #9b5fb8; } .s-won { --st: #2f7d4f; } .s-lost { --st: #b23b3b; }
.card { text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; display: grid; gap: 3px; font-size: .82rem; color: var(--ink); }
.card:hover { border-color: var(--st); }
.card[aria-pressed="true"] { outline: 2px solid var(--olive); }
.card .t { font-weight: 700; line-height: 1.3; }
.card .m { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
.card.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--honey-soft); border-color: var(--honey); } 100% {} }
@media (prefers-reduced-motion: reduce) { .card.flash { animation: none; border-color: var(--honey); } }
.pill { display: inline-block; border-radius: 99px; padding: 0 7px; font-size: .7rem; font-weight: 700; background: var(--olive-soft); color: var(--olive); }
.pill.ai { background: var(--honey-soft); color: #8a5c06; }
.pill.hot { background: var(--bad-soft); color: var(--bad); }
.score { display: inline-grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 50%; font-weight: 700; font-size: .78rem; background: var(--olive-soft); color: var(--olive); font-variant-numeric: tabular-nums; }
.score.hot { background: var(--bad-soft); color: var(--bad); } .score.warm { background: var(--honey-soft); color: #8a5c06; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 14px; }
.panel-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: start; }
.panel-head h2 { font-size: 1.3rem; color: var(--olive); }
.stages { display: flex; gap: 4px; flex-wrap: wrap; }
.stages button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: .8rem; }
.stages button[aria-pressed="true"] { background: var(--st); border-color: var(--st); color: #fff; font-weight: 700; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.fact { background: var(--bg); border-radius: 8px; padding: 6px 9px; }
.fact span { display: block; font-size: .72rem; color: var(--muted); }
.fact b { font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tier { border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; }
.tier.rec { border: 2px solid var(--olive); background: var(--olive-soft); }
.tier b { font-family: var(--display); font-size: 1.1rem; color: var(--olive); font-variant-numeric: tabular-nums; }
.tier small { color: var(--muted); font-variant-numeric: tabular-nums; }
h3.sub { font-family: var(--body); font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 300px; overflow-y: auto; }
.timeline li { display: grid; grid-template-columns: 62px 1fr; gap: 6px; padding: 5px 6px; border-inline-start: 3px solid var(--line); font-size: .86rem; }
.timeline li .w { font-size: .72rem; font-weight: 700; color: var(--muted); }
.k-stage { border-color: var(--olive) !important; } .k-quote { border-color: var(--honey) !important; } .k-handoff { border-color: var(--bad) !important; } .k-chat { border-color: #4f7cac !important; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .88rem; }
.tasks li.high { font-weight: 700; }
.reasons { margin: 0; padding-inline-start: 16px; color: var(--muted); font-size: .82rem; }
.handoff { background: var(--bad-soft); border: 1px solid var(--bad); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.handoff b { color: var(--bad); }
.handoff form { display: flex; gap: 6px; } .handoff input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: var(--surface); }
.empty { color: var(--muted); }
.banner { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; font-size: .9rem; }
.banner[hidden] { display: none; }
</style>
</head>
<body>
<header class="top">
  <div><h1>זית ודבש · CRM + סוכן מכירות AI</h1><p>הלקוח מדבר עם הסוכן, וכל מה שהסוכן אוסף נכנס ל-CRM בזמן אמת.</p></div>
  <button class="ghost" id="reset" type="button">איפוס הדמו</button>
</header>
<div class="wrap">
  <section class="phone" aria-label="צ'אט לקוח">
    <header><div><b>נועה · זית ודבש</b><span id="chatState">סוכנת AI · עונה מיד</span></div><button class="ghost" id="newChat" type="button" style="color:var(--surface);border-color:rgba(255,255,255,.4);background:transparent">שיחה חדשה</button></header>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form class="send" id="sendForm">
      <label for="chatIn" style="position:absolute;width:1px;height:1px;overflow:hidden">הודעה</label>
      <input id="chatIn" autocomplete="off" placeholder="כתבו כמו לקוח…">
      <button class="primary" id="sendBtn" type="submit">שליחה</button>
    </form>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="crm" aria-label="CRM">
    <div class="kpis" id="kpis"></div>
    <div class="banner" id="localNote">הנתונים נשמרים רק בדפדפן הזה. "איפוס הדמו" מחזיר את נתוני הדוגמה.</div>
    <div class="board" id="board"></div>
    <article class="panel" id="panel"></article>
  </section>
</div>

const BY_SKU = Object.fromEntries(CATALOG.map(i => [i.sku, i]));
const VAT = 0.18;
const BUSINESS = { name: "זית ודבש קייטרינג", phone: "03-0000000" };



// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ils = n => "₪" + Number(n).toLocaleString("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const r2 = n => Math.round(n * 100) / 100;
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function fmtDate(iso) {
  if (!iso) return null;
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("he-IL", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
}
function addDays(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

const LABELS = {
  event_type: { wedding: "חתונה", bar_bat_mitzvah: "בר/בת מצווה", brit: "ברית", birthday: "יום הולדת", corporate: "אירוע חברה", conference: "כנס", holiday: "אירוע חג", private: "אירוע פרטי", other: "אחר" },
  kashrut: { none: "לא נדרש", kosher: "כשר", mehadrin: "מהדרין" },
  meal_type: { meat: "בשרי", dairy: "חלבי", pareve: "פרווה" },
  diet: { vegan: "טבעוני", vegetarian: "צמחוני", gluten_free: "ללא גלוטן", nut_free: "ללא אגוזים", lactose_free: "ללא לקטוז" },
  unit: { per_guest: "לסועד", unit: "יח'", tray: "מגש", kg: "ק\"ג", hour: "שעות" },
  missing: { guest_count: "מספר אורחים", event_date: "תאריך", meal_type: "בשרי/חלבי", kashrut: "כשרות", location: "מיקום" },
  conf: { high: "התאמה גבוהה", medium: "לבדיקה", low: "לא ודאי", rule: "כלל עסקי" },
  src: { requested: "ביקש הלקוח", suggested: "הצעת AI", rule: "אוטומטי" },
};

// ---------- step 2: menu selection prompt (retrieval: only compatible catalog items are offered) ----------
function compatibleCatalog(req) {
  const allowed = { meat: ["meat", "pareve"], dairy: ["dairy", "pareve"], pareve: ["pareve"] }[req.meal_type] || ["meat", "dairy", "pareve"];
  return CATALOG.filter(i => !["staff", "logistics"].includes(i.category) && allowed.includes(i.meal_type));
}
// ---------- step 3: deterministic pricing (no LLM) ----------
const REMOTE = ["ירושלים", "חיפה", "צפון", "גליל", "עמק", "באר שבע", "אילת", "נגב", "גולן", "jerusalem", "haifa", "north", "galilee", "beer sheva", "eilat"];
const WAITER_RATIO = 15, BARTENDER_RATIO = 75, STAFF_HOURS = 5, CANAPES_PER_GUEST = 3;

function computeQuantity(item, line, guests) {
  if (line.quantity != null && line.quantity > 0) return { qty: line.quantity, note: "כמות שביקש הלקוח" };
  const g = line.for_guests || guests;
  if (!g) return { qty: null, note: "חסר מספר אורחים" };
  if (item.serves) return { qty: Math.ceil(g / item.serves), note: `${g} סועדים ÷ ${item.serves} למגש` };
  if (item.unit === "per_guest") return { qty: g, note: `${g} סועדים` };
  if (item.category === "canape") return { qty: g * CANAPES_PER_GUEST, note: `${CANAPES_PER_GUEST} יח' לסועד` };
  if (item.unit === "hour") return { qty: STAFF_HOURS, note: `${STAFF_HOURS} שעות` };
  return { qty: g, note: `${g} סועדים` };
}

function priceQuote(req, menu) {
  const guests = req.guest_count || null;
  const guards = [];
  const rows = [];
  const allowedMeal = { meat: ["meat", "pareve"], dairy: ["dairy", "pareve"], pareve: ["pareve"] }[req.meal_type];
  const kosher = req.kashrut === "kosher" || req.kashrut === "mehadrin";
  const mealTypesUsed = new Set();

  for (const line of (menu.lines || []).map((l, i) => ({ ...l, _i: l._i ?? i }))) {
    const item = BY_SKU[line.sku];
    if (!item) { guards.push(`הוסר פריט שלא קיים בקטלוג (${line.sku})`); continue; }
    if (allowedMeal && !allowedMeal.includes(item.meal_type)) { guards.push(`הוסר "${item.name_he}": לא מתאים לאירוע ${LABELS.meal_type[req.meal_type]}`); continue; }
    let { qty, note } = computeQuantity(item, line, guests);
    if (qty == null) { guards.push(`"${item.name_he}" ללא כמות: חסר מספר אורחים`); continue; }
    if (item.min_qty && qty < item.min_qty) { qty = item.min_qty; note = `מינימום הזמנה ${item.min_qty}`; }
    if (item.meal_type !== "pareve") mealTypesUsed.add(item.meal_type);
    rows.push({ item, qty, note, source: line.source === "requested" ? "requested" : "suggested", confidence: line.confidence || "medium", reason: line.reason || "", idx: line._i });
  }
  if (kosher && mealTypesUsed.has("meat") && mealTypesUsed.has("dairy")) {
    const drop = req.meal_type === "dairy" ? "meat" : "dairy";
    for (let i = rows.length - 1; i >= 0; i--) if (rows[i].item.meal_type === drop) { guards.push(`הוסר "${rows[i].item.name_he}": אין ערבוב בשרי וחלבי באירוע כשר`); rows.splice(i, 1); }
  }

  const add = (sku, qty, note) => rows.push({ item: BY_SKU[sku], qty, note, source: "rule", confidence: "rule", reason: "" });
  const sv = req.service || {};
  if (guests) {
    const wantWaiters = sv.waiters === true || (sv.waiters == null && guests >= 60 && rows.some(r => ["package", "main"].includes(r.item.category)));
    if (wantWaiters) {
      const n = Math.ceil(guests / WAITER_RATIO);
      add("STF-WAITER", n * STAFF_HOURS, `${n} מלצרים × ${STAFF_HOURS} ש' (מלצר לכל ${WAITER_RATIO})`);
      if (guests >= 80) add("STF-HEAD-WAITER", STAFF_HOURS, `מנהל אירוע × ${STAFF_HOURS} ש'`);
    }
    const hasOpenBar = rows.some(r => r.item.sku === "BAR-OPEN");
    if ((sv.bar === true || rows.some(r => r.item.category === "bar")) && !hasOpenBar) {
      const n = Math.ceil(guests / BARTENDER_RATIO);
      add("STF-BARTENDER", n * STAFF_HOURS, `${n} ברמנים × ${STAFF_HOURS} ש'`);
    }
    if (req.kashrut === "mehadrin") add("LOG-MEHADRIN", guests, `${guests} סועדים`);
  }
  if (sv.equipment === true || rows.some(r => r.item.category === "equipment")) add("LOG-SETUP", 1, "");
  if (rows.length) {
    const loc = (req.location || "").toLowerCase();
    const remote = REMOTE.some(k => loc.includes(k));
    add(remote ? "LOG-DELIVERY-F" : "LOG-DELIVERY-C", 1, req.location ? `ל${req.location}` : "אזור מרכז (ברירת מחדל)");
  }

  for (const r of rows) r.total = r2(r.qty * r.item.price);
  const subtotal = r2(rows.reduce((s, r) => s + r.total, 0));
  const discRate = subtotal >= 50000 ? 0.08 : subtotal >= 20000 ? 0.05 : 0;
  const discount = r2(subtotal * discRate);
  const net = r2(subtotal - discount);
  const vat = r2(net * VAT);
  const total = r2(net + vat);

  let budget = null;
  if (req.budget && req.budget.amount) {
    if (req.budget.scope === "per_guest" && guests) {
      const per = r2(total / guests);
      budget = { ok: per <= req.budget.amount * 1.05, text: `עלות לסועד כולל מע"מ: ${ils(per)} מול תקציב של ${ils(req.budget.amount)} לסועד` };
    } else if (req.budget.scope === "total") {
      budget = { ok: total <= req.budget.amount * 1.05, text: `סה"כ ${ils(total)} מול תקציב כולל של ${ils(req.budget.amount)}` };
    }
  }
  if (req.suspicious_instructions) guards.push("זוהתה הוראה למערכת בתוך ההודעה: לא בוצעה");
  return { rows, subtotal, discRate, discount, net, vat, total, budget, guards };
}

const UPGRADES = { "PKG-MEAT-STD": "PKG-MEAT-PREM", "PKG-CORP-LUNCH": "PKG-MEAT-STD", "MAIN-SCHNITZEL": "MAIN-CHICK-PARG", "MAIN-CHICK-PARG": "MAIN-ENTRECOTE", "MAIN-CHICK-BREAST": "MAIN-ASADO", "BAR-BEER": "BAR-COCKTAIL", "EQP-DISP": "EQP-DISH-PREM", "MAIN-QUICHE": "MAIN-SALMON" };
const DOWNGRADES = { "PKG-MEAT-PREM": "PKG-MEAT-STD", "MAIN-ENTRECOTE": "MAIN-CHICK-PARG", "MAIN-ASADO": "MAIN-CHICK-PARG", "MAIN-DENIS": "MAIN-SALMON", "BAR-OPEN": "BAR-BEER", "BAR-COCKTAIL": "BAR-BEER", "EQP-DISH-PREM": "EQP-DISP", "CAN-SUSHI": "CAN-SUSHI-VEG" };
const PREMIUM_EXTRAS = { meat: ["STR-CARPACCIO", "DES-PETIT-FOUR", "DRK-COFFEE"], dairy: ["STR-SALMON-CEV", "DES-PETIT-FOUR", "DRK-COFFEE"], pareve: ["STR-SOUP-PUMP", "DES-PETIT-FOUR", "DRK-COFFEE"] };
const BASIC_DROPS = ["canape", "starter", "bar"];
const ALLOWED = { meat: ["meat", "pareve"], dairy: ["dairy", "pareve"], pareve: ["pareve"] };
const okMeal = (req, sku) => !req.meal_type || ALLOWED[req.meal_type].includes(BY_SKU[sku].meal_type);

function buildTiers(req, menu) {
  const lines = (menu.lines || []).map((l, i) => ({ ...l, _i: i }));
  const swap = (map, l, changes) => {
    const n = map[l.sku];
    if (l.source === "requested" || !n || !BY_SKU[l.sku] || !okMeal(req, n)) return l;
    changes.push(`${BY_SKU[l.sku].name_he} ← ${BY_SKU[n].name_he}`);
    return { ...l, sku: n, reason: "" };
  };
  const bc = [], basic = [];
  for (const l of lines) {
    const it = BY_SKU[l.sku];
    if (it && l.source !== "requested" && BASIC_DROPS.includes(it.category)) { bc.push(`בלי ${it.name_he}`); continue; }
    basic.push(swap(DOWNGRADES, l, bc));
  }
  const pc = [], prem = lines.map(l => swap(UPGRADES, l, pc));
  const present = new Set(prem.map(l => l.sku));
  for (const sku of PREMIUM_EXTRAS[req.meal_type || "pareve"]) {
    if (!present.has(sku) && okMeal(req, sku)) { prem.push({ sku, for_guests: null, quantity: null, source: "suggested", confidence: "high", reason: "תוספת בחבילת פרימיום", _i: null }); pc.push(`+ ${BY_SKU[sku].name_he}`); }
  }
  return [
    { key: "basic", name: "בסיס", changes: bc, menu: { ...menu, lines: basic } },
    { key: "recommended", name: "מומלץ", changes: [], menu: { ...menu, lines } },
    { key: "premium", name: "פרימיום", changes: pc, menu: { ...menu, lines: prem } },
  ].map(t => ({ ...t, q: priceQuote(req, t.menu) }));
}

const KEY = "zit-dvash-crm-demo-v1";
const STAGES = [["new", "ליד חדש"], ["contacted", "בשיחה"], ["quoted", "הצעה נשלחה"], ["negotiation", "משא ומתן"], ["won", "נסגר"], ["lost", "אבוד"]];

const SOURCE_HE = { web_chat: "צ'אט AI", phone: "טלפון", email: "מייל", referral: "המלצה", whatsapp: "וואטסאפ" };

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
const nowISO = () => new Date().toISOString();
const plusDays = n => addDays(todayISO(), n);
const ilsR = n => n == null ? "—" : "₪" + Math.round(n).toLocaleString("he-IL");

function normPhone(raw) {
  if (!raw) return null;
  let d = String(raw).replace(/\D/g, "");
  if (d.startsWith("972")) d = d.slice(3); else if (d.startsWith("0")) d = d.slice(1); else return raw;
  return d.length >= 8 && d.length <= 9 ? "+972" + d : raw;
}

function seed() {
  const S = { customers: [], deals: [], activities: [], tasks: [], conv: null, selected: null, quotes: {} };
  const rows = [
    ["יוסי כהן", "0529876543", "wedding", 45, 220, "meat", "mehadrin", "negotiation", 86400, "phone"],
    ["נטע אברהם", "0541112233", "brit", 9, 60, "dairy", "kosher", "won", 9850, "web_chat"],
    ["דנה שפירא", "0587654321", "corporate", 26, 180, "meat", "kosher", "won", 61200, "email"],
    ["רונית גל", "0502223344", "birthday", 14, 35, "dairy", null, "new", null, "web_chat"],
    ["אבי מזרחי", "0545556677", "wedding", 80, 300, "meat", "mehadrin", "quoted", 118500, "referral"],
    ["ליאת רוזן", "0521212121", "bar_bat_mitzvah", 60, 140, "meat", "kosher", "contacted", null, "whatsapp"],
    ["שירה בן דוד", "0526667788", "private", 21, 30, "dairy", "kosher", "lost", 7400, "web_chat"],
  ];
  for (const [name, phone, et, days, g, meal, k, stage, value, src] of rows) {

    S.customers.push(c);
    const d = { id: uid(), customer_id: c.id, stage, value, event_type: et, event_date: plusDays(days), guest_count: g, meal_type: meal, kashrut: k, location: null, dietary: [], budget: null, budget_scope: null, quote_ids: [], source: src, updated_at: nowISO() };
    rescore(S, d); S.deals.push(d);
    S.activities.push({ id: uid(), deal_id: d.id, kind: "system", actor: "system", text: `ליד חדש (${SOURCE_HE[src]})`, at: nowISO() });
    if (stage !== "new") S.activities.push({ id: uid(), deal_id: d.id, kind: "stage", actor: "user", text: `ליד חדש ← ${STAGE_HE[stage]}`, at: nowISO() });

  S.selected = S.deals[0].id;
  return S;

function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.deals)) return s; } catch {} return seed(); }

// lead score: same rules as backend/app/crm/scoring.py
function rescore(st, d) {
  const c = st.customers.find(x => x.id === d.customer_id);
  const days = d.event_date ? Math.round((new Date(d.event_date) - new Date(todayISO())) / 864e5) : null;
  const rules = [
    [20, "יש טלפון או מייל", !!(c && (c.phone || c.email))], [15, "תאריך אירוע ידוע", !!d.event_date],
    [15, "מספר אורחים ידוע", !!d.guest_count], [10, "ציין תקציב", d.budget != null],
    [10, "אירוע בתוך 60 יום", days != null && days >= 0 && days <= 60], [10, "אירוע גדול (80+ אורחים)", (d.guest_count || 0) >= 80],
    [10, "ביקש הצעת מחיר", d.quote_ids.length > 0], [10, "כשרות וסוג ארוחה ידועים", !!(d.kashrut && d.meal_type)],
  ];
  d.score_reasons = rules.filter(r => r[2]).map(r => `+${r[0]} ${r[1]}`);
  d.lead_score = Math.min(100, rules.reduce((s, r) => s + (r[2] ? r[0] : 0), 0));
  const who = c && (c.name || c.company);
  d.title = [EVENT_HE[d.event_type] || "אירוע", who, d.guest_count && `${d.guest_count} אורחים`, d.event_date && d.event_date.slice(8, 10) + "." + d.event_date.slice(5, 7)].filter(Boolean).join(" · ");
}
function log(deal_id, kind, text, actor = "system") { S.activities.push({ id: uid(), deal_id, kind, text, actor, at: nowISO() }); }
function moveStage(d, stage, actor) { if (d.stage === stage) return; log(d.id, "stage", `${STAGE_HE[d.stage]} ← ${STAGE_HE[stage]}`, actor); d.stage = stage; d.updated_at = nowISO(); }
function availability(date, guests, exclude) {
  const booked = S.deals.filter(d => d.event_date === date && ["won", "negotiation"].includes(d.stage) && d.id !== exclude);
  const g = booked.reduce((s, d) => s + (d.guest_count || 0), 0), remaining = Math.max(0, 600 - g);
  const ok = booked.length < 3 && (guests || 0) <= remaining;
  return { available: ok, note: ok ? (booked.length ? `פנוי (${booked.length} אירועים כבר מתוכננים)` : "פנוי") : booked.length >= 3 ? "היומן מלא בתאריך הזה" : `נשאר מקום לעד ${remaining} אורחים` };
}
function standardPlan(req) {
  const lines = []; let special = 0;
  for (const d of req.dietary_requirements || []) {
    if ((d.tag === "vegan" || d.tag === "vegetarian") && d.guest_count && req.meal_type !== "pareve") { lines.push({ sku: "PKG-VEGAN", for_guests: d.guest_count, source: "suggested", confidence: "high", reason: `עבור ${d.guest_count} אורחים ${LABELS.diet[d.tag]}` }); special += d.guest_count; }
  }
  const main = { meat: "PKG-MEAT-STD", dairy: "PKG-DAIRY-STD", pareve: "PKG-VEGAN" }[req.meal_type] || "PKG-MEAT-STD";
  lines.unshift({ sku: main, for_guests: Math.max(1, (req.guest_count || 1) - special), source: "suggested", confidence: "high", reason: "חבילה מלאה לאירוע" });
  lines.push({ sku: { meat: "CAN-SKEWER-CHICK", dairy: "CAN-MINI-QUICHE", pareve: "CAN-VEG-SKEWER" }[req.meal_type] || "CAN-VEG-SKEWER", for_guests: null, source: "suggested", confidence: "medium", reason: "קבלת פנים" });
  lines.push({ sku: "DRK-SOFT", for_guests: null, source: "suggested", confidence: "high", reason: "שתייה לכל האורחים" });
  return { lines, unmatched: [], cover_note: "" };
}
function dealRequest(d) {
  const c = S.customers.find(x => x.id === d.customer_id);
  return { language: "he", customer_name: c && c.name, event_type: d.event_type, guest_count: d.guest_count, event_date: d.event_date, location: d.location, kashrut: d.kashrut, meal_type: d.meal_type,
    dietary_requirements: d.dietary.map(x => { const [tag, n] = x.split(":"); return { tag, guest_count: n ? +n : null }; }),
    budget: d.budget ? { amount: d.budget, scope: d.budget_scope || "total" } : null, service: { waiters: (d.guest_count || 0) >= 60 }, requested_items: [], missing_info: [], suspicious_instructions: false };
}

// ======================= sales agent tools (mirror backend/app/agent/sales.py) =======================
function agentTools(log_) {
  const conv = S.conv;
  const deal = () => conv.deal_id && S.deals.find(d => d.id === conv.deal_id);
  const checkDate = s => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) throw new Error("פורמט תאריך YYYY-MM-DD");
    if (s < todayISO()) throw new Error("התאריך כבר עבר. בקשי מהלקוח תאריך עתידי.");
    return s;
  };
  const checkGuests = n => { n = Math.round(+n); if (!(n >= 1 && n <= 2000)) throw new Error("מספר אורחים בין 1 ל-2000"); return n; };
  const wrap = (name, fn) => input => { try { const out = fn(input || {}); log_.push({ name, ok: true }); return out; } catch (e) { log_.push({ name, ok: false }); throw e; } };
  const obj = (p, r = []) => ({ type: "object", properties: p, required: r });
  const meal = { type: "string", enum: ["meat", "dairy", "pareve"] };
  return [
    { name: "search_menu", description: "חיפוש בתפריט ובקטלוג. מחזיר מחירים לפני מע\"מ.", inputSchema: obj({ query: { type: "string" }, meal_type: meal }, ["query"]),
      execute: wrap("search_menu", ({ query, meal_type }) => { const toks = String(query).toLowerCase().split(/\s+/).filter(t => t.length > 1);
        return compatibleCatalog({ meal_type }).map(i => ({ i, s: toks.filter(t => `${i.name_he} ${i.name_en} ${i.category} ${i.description_he}`.toLowerCase().includes(t)).length })).filter(x => x.s).sort((a, b) => b.s - a.s).slice(0, 6)
          .map(({ i }) => ({ name: i.name_he, description: i.description_he, price_before_vat: i.price, unit: i.unit, serves: i.serves || null, meal_type: i.meal_type })); }) },
    { name: "check_availability", description: "בדיקת זמינות לתאריך (YYYY-MM-DD).", inputSchema: obj({ event_date: { type: "string" }, guest_count: { type: "integer" } }, ["event_date"]),
      execute: wrap("check_availability", ({ event_date, guest_count }) => ({ date: checkDate(event_date), ...availability(event_date, guest_count ? checkGuests(guest_count) : 0, conv.deal_id) })) },
    { name: "estimate_price", description: "הערכת מחיר ל-3 חבילות לפי אורחים וסוג ארוחה.", inputSchema: obj({ guest_count: { type: "integer" }, meal_type: meal, kashrut: { type: "string", enum: ["none", "kosher", "mehadrin"] } }, ["guest_count"]),
      execute: wrap("estimate_price", ({ guest_count, meal_type = "meat", kashrut = "kosher" }) => { const g = checkGuests(guest_count);
        const req = { guest_count: g, meal_type, kashrut, service: { waiters: g >= 60 }, dietary_requirements: [] };
        return { note: "הערכה כולל מע\"מ, צוות ומשלוח", packages: buildTiers(req, standardPlan(req)).map(t => ({ name: t.name, total: t.q.total, per_guest: r2(t.q.total / g) })) }; }) },
    { name: "save_lead", description: "שמירה/עדכון של פרטי הלקוח והאירוע ב-CRM. רק שדות ידועים.", inputSchema: obj({ name: { type: "string" }, phone: { type: "string" }, email: { type: "string" },
        event_type: { type: "string", enum: Object.keys(EVENT_HE) }, event_date: { type: "string" }, guest_count: { type: "integer" }, location: { type: "string" },
        kashrut: { type: "string", enum: ["none", "kosher", "mehadrin"] }, meal_type: meal, budget: { type: "number" }, budget_scope: { type: "string", enum: ["total", "per_guest"] },
        dietary: { type: "array", items: obj({ tag: { type: "string", enum: Object.keys(LABELS.diet) }, guest_count: { type: "integer" } }, ["tag"]) } }),
      execute: wrap("save_lead", f => {
        let d = deal(), isNew = false;
        const phone = normPhone(f.phone);
        let c = d ? S.customers.find(x => x.id === d.customer_id) : (phone && S.customers.find(x => x.phone === phone));
        if (!c) { c = { id: uid(), name: null, phone: null, email: null, source: "web_chat" }; S.customers.push(c); }
        if (f.name) c.name = f.name; if (phone) c.phone = phone; if (f.email) c.email = String(f.email).toLowerCase();
        if (!d) { d = { id: uid(), customer_id: c.id, stage: "contacted", value: null, event_type: null, event_date: null, guest_count: null, meal_type: null, kashrut: null, location: null, dietary: [], budget: null, budget_scope: null, quote_ids: [], source: "web_chat" }; S.deals.push(d); isNew = true; }
        if (f.event_date) d.event_date = checkDate(f.event_date);
        if (f.guest_count) d.guest_count = checkGuests(f.guest_count);
        for (const k of ["event_type", "location", "kashrut", "meal_type", "budget_scope"]) if (f[k]) d[k] = f[k];
        if (f.budget) d.budget = +f.budget;
        if (f.dietary) d.dietary = f.dietary.map(x => x.guest_count ? `${x.tag}:${x.guest_count}` : x.tag);
        d.updated_at = nowISO(); rescore(S, d);
        conv.deal_id = d.id; conv.customer_id = c.id;
        if (isNew) log(d.id, "chat", "ליד חדש מצ'אט האתר", "agent");
        S.selected = d.id; flashId = d.id;
        return { saved: true, lead_score: d.lead_score, missing: Object.entries({ event_date: d.event_date, guest_count: d.guest_count, meal_type: d.meal_type, name: c.name, phone: c.phone || c.email }).filter(([, v]) => !v).map(([k]) => k) };
      }) },
    { name: "create_quote", description: "יצירת הצעת מחיר רשמית (3 חבילות) לליד השמור.", inputSchema: obj({}),
      execute: wrap("create_quote", () => {
        const d = deal(); if (!d || !d.guest_count || !d.meal_type) throw new Error("צריך קודם save_lead עם מספר אורחים וסוג ארוחה");
        const req = dealRequest(d), tiers = buildTiers(req, standardPlan(req));
        const number = "Q-" + new Date().getFullYear() + "-" + (1000 + Object.keys(S.quotes).length + 1);
        const id = uid(); S.quotes[id] = { number, tiers: tiers.map(t => ({ name: t.name, key: t.key, total: t.q.total, per_guest: r2(t.q.total / d.guest_count), lines: t.q.rows.map(r => r.item.name_he) })) };
        d.quote_ids.push(id); d.value = tiers[1].q.total; rescore(S, d);
        moveStage(d, "quoted", "agent"); log(d.id, "quote", `הצעת מחיר ${number} נוצרה בצ'אט`, "agent"); flashId = d.id;
        return { quote_number: number, packages: S.quotes[id].tiers.map(t => ({ name: t.name, total: t.total, per_guest: t.per_guest })) };
      }) },
    { name: "handoff_to_human", description: "העברה לנציג אנושי (סגירה, הנחה, תלונה, שאלה מורכבת).", inputSchema: obj({ reason: { type: "string" }, urgent: { type: "boolean" }, ready_to_book: { type: "boolean" } }, ["reason"]),
      execute: wrap("handoff_to_human", ({ reason, urgent, ready_to_book }) => {
        conv.status = "handed_off"; const d = deal();
        S.tasks.push({ id: uid(), deal_id: d && d.id, title: `לחזור ללקוח מהצ'אט: ${reason}`, due: todayISO(), priority: "high", by: "agent", done: false });
        if (d) { log(d.id, "handoff", `הועבר לנציג: ${reason}`, "agent"); if (ready_to_book && ["contacted", "quoted"].includes(d.stage)) moveStage(d, "negotiation", "agent"); flashId = d.id; }
        return { handed_off: true, human_reply_within: urgent ? "שעה" : "4 שעות" };
      }) },
  ];
}

  const history = S.conv.messages.slice(-16, -1).map(m => `${m.role === "user" ? "לקוח" : m.by === "human" ? "נציג" : "נועה"}: ${m.text}`).join("\n");
  return `את נועה, נציגת המכירות הדיגיטלית של זית ודבש, קייטרינג כשר לאירועים. את מדברת עם לקוח בצ'אט באתר. היום: ${todayISO()}.

השיחה עד עכשיו:

כתבי רק את התשובה של נועה ללקוח.`;
}

  $("#chatState").textContent = c && c.status === "handed_off" ? "הועבר לנציג אנושי" : "סוכנת AI · עונה מיד";
}
const TOOL_HE = { save_lead: "✓ נשמר ב-CRM", check_availability: "✓ בדקה זמינות", estimate_price: "✓ חישבה הערכה", create_quote: "✓ יצרה הצעת מחיר", handoff_to_human: "✓ העבירה לנציג", search_menu: "✓ חיפשה בתפריט" };

function renderKpis() {
  const open = S.deals.filter(d => ["new", "contacted", "quoted", "negotiation"].includes(d.stage));
  const waiting = S.conv && S.conv.status === "handed_off" ? 1 : 0;
  $("#kpis").innerHTML = `
    <div class="kpi"><span>Pipeline פתוח</span><b>${ilsR(open.reduce((s, d) => s + (d.value || 0), 0))}</b></div>
    <div class="kpi"><span>לידים פתוחים</span><b>${open.length}</b></div>
    <div class="kpi"><span>לידים חמים (70+)</span><b>${open.filter(d => d.lead_score >= 70).length}</b></div>
    <div class="kpi ${waiting ? "alert" : ""}"><span>ממתינים לנציג</span><b>${waiting}</b></div>`;
}
function renderBoard() {
  $("#board").innerHTML = STAGES.map(([k, label]) => {
    const ds = S.deals.filter(d => d.stage === k).sort((a, b) => b.lead_score - a.lead_score);
    return `<div class="col s-${k}"><h3>${label}<span>${ds.length}</span></h3>${ds.map(d => `
      <button class="card${d.id === flashId ? " flash" : ""}" type="button" data-deal="${d.id}" aria-pressed="${d.id === S.selected}">
        <span class="t">${esc(d.title)}</span>
        <span class="m"><span>${ilsR(d.value)}</span><span class="score ${d.lead_score >= 70 ? "hot" : d.lead_score >= 40 ? "warm" : ""}">${d.lead_score}</span></span>
        <span>${d.source === "web_chat" ? '<span class="pill ai">AI</span>' : `<span class="pill">${SOURCE_HE[d.source] || d.source}</span>`}</span>
      </button>`).join("")}</div>`;
  }).join("");
}
function renderPanel() {
  const d = S.deals.find(x => x.id === S.selected);
  if (!d) { $("#panel").innerHTML = `<p class="empty">בחרו עסקה</p>`; return; }
  const c = S.customers.find(x => x.id === d.customer_id) || {};
  const acts = S.activities.filter(a => a.deal_id === d.id).slice().reverse();
  const tasks = S.tasks.filter(t => t.deal_id === d.id && !t.done);
  const q = d.quote_ids.length ? S.quotes[d.quote_ids[d.quote_ids.length - 1]] : null;
  const isChatDeal = S.conv && S.conv.deal_id === d.id;
  const fact = (k, v) => `<div class="fact"><span>${k}</span><b>${v == null || v === "" ? "—" : esc(v)}</b></div>`;
  $("#panel").innerHTML = `
    <div class="panel-head">
      <div><h2>${esc(d.title)}</h2><div class="hint">${d.source === "web_chat" ? '<span class="pill ai">הגיע מסוכן AI</span> ' : ""}${esc(c.name || "")} <span dir="ltr">${esc(c.phone || "")}</span></div></div>
      <div class="stages" role="group" aria-label="שלב">${STAGES.map(([k, l]) => `<button type="button" class="s-${k}" data-stage="${k}" aria-pressed="${d.stage === k}">${l}</button>`).join("")}</div>
    </div>
    ${isChatDeal && S.conv.status === "handed_off" ? `<div class="handoff"><b>הסוכן העביר את השיחה אליך.</b> ענו ללקוח כאן, והתשובה תופיע בצ'אט.
      <form id="humanForm"><label for="humanIn" style="position:absolute;width:1px;height:1px;overflow:hidden">תשובת נציג</label><input id="humanIn" placeholder="תשובה בתור נציג…"><button class="primary" type="submit">שליחה</button><button class="ghost" type="button" id="resumeAi">להחזיר לסוכן</button></form></div>` : ""}
    <div class="facts">
      ${fact("ערך", ilsR(d.value))}${fact("תאריך", fmtDate(d.event_date))}${fact("אורחים", d.guest_count)}
      ${fact("ארוחה", [LABELS.meal_type[d.meal_type], LABELS.kashrut[d.kashrut]].filter(Boolean).join(" · "))}
      ${d.dietary.length ? fact("תזונה", d.dietary.map(x => { const [t, n] = x.split(":"); return (LABELS.diet[t] || t) + (n ? " ×" + n : ""); }).join(", ")) : ""}
      ${d.budget ? fact("תקציב", ilsR(d.budget) + (d.budget_scope === "per_guest" ? " לאורח" : "")) : ""}
    </div>
    <div class="two">
      <div>
        <h3 class="sub">הצעת מחיר${q ? " · " + q.number : ""}</h3>
        ${q ? `<div class="tiers">${q.tiers.map(t => `<div class="tier ${t.key === "recommended" ? "rec" : ""}"><span>${t.name}</span><b>${ilsR(t.total)}</b><small>${ilsR(t.per_guest)} לאורח</small></div>`).join("")}</div>` : `<p class="empty">עוד אין הצעה. הסוכן יוצר אותה כשיש תאריך, אורחים, סוג ארוחה ופרטי קשר.</p>`}
        <h3 class="sub" style="margin-top:12px">ציר פעילות</h3>
        <ol class="timeline">${acts.map(a => `<li class="k-${a.kind}"><span class="w">${ACTOR_HE[a.actor]}</span><span>${esc(a.text)}</span></li>`).join("") || `<li class="empty">אין פעילות</li>`}</ol>
      </div>
      <div>
        <h3 class="sub">ציון ליד <span class="score ${d.lead_score >= 70 ? "hot" : d.lead_score >= 40 ? "warm" : ""}">${d.lead_score}</span></h3>
        <ul class="reasons">${(d.score_reasons || []).map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        <h3 class="sub" style="margin-top:12px">משימות</h3>
        <ul class="tasks">${tasks.map(t => `<li class="${t.priority}"><label><input type="checkbox" data-task="${t.id}"> ${t.by === "agent" ? '<span class="pill ai">AI</span> ' : ""}${esc(t.title)}</label></li>`).join("") || `<li class="empty">אין משימות פתוחות</li>`}</ul>
      </div>
    </div>`;
  const hf = $("#humanForm");
  if (hf) {
    hf.onsubmit = e => { e.preventDefault(); const v = $("#humanIn").value.trim(); if (!v) return;
      S.conv.messages.push({ role: "assistant", by: "human", text: v, tools: [] }); log(d.id, "chat", `נציג ענה בצ'אט: ${v}`, "user"); render(); };
    $("#resumeAi").onclick = () => { S.conv.status = "active"; log(d.id, "system", "השיחה הוחזרה לסוכן AI", "user"); render(); };
  }
}

// ======================= chat =======================
let busy = false, samplePromise = null;
const STARTERS = ["היי, בר מצווה ל-120 איש בעוד חודש בערך", "כמה עולה אירוע חלבי ל-40 איש?", "אני מיכל, 050-1234567", "אפשר לקבל הנחה?"];
function newConversation() {
  S.conv = { id: uid(), status: "active", deal_id: null, customer_id: null, messages: [{ role: "assistant", by: "ai", text: "היי! אני נועה מזית ודבש 🙂 איזה אירוע אתם מתכננים?", tools: [] }] };
}
async function send(text) {
  text = text.trim(); if (!text || busy) return;
  const sample = await (samplePromise ||= window.claude?.use ? window.claude.use("sample") : Promise.resolve(null));
  S.conv.messages.push({ role: "user", text });
  $("#chatIn").value = ""; $("#status").textContent = "";
  if (S.conv.status === "handed_off") {
    const d = S.deals.find(x => x.id === S.conv.deal_id);
    if (d) log(d.id, "chat", `הודעה חדשה מהלקוח: ${text}`, "customer");
    S.conv.messages.push({ role: "assistant", by: "ai", text: "קיבלתי, העברתי את ההודעה לנציג שמטפל בך. הוא יחזור אלייך בהקדם 🙏", tools: [] });
    render(); return;
  }
  if (!sample) { S.conv.messages.pop(); $("#status").textContent = "החיבור ל-Claude לא זמין בתצוגה הזו. פתחו את הדף ב-claude.ai כדי לדבר עם הסוכן."; render(); return; }
  busy = true; $("#sendBtn").disabled = true; render();
  const used = [];
  try {
    const res = await sample(agentPrompt(text), { tools: agentTools(used), modelTier: "default", cache: false });
    S.conv.messages.push({ role: "assistant", by: "ai", text: (res.text || "").trim() || "סליחה, אפשר לנסות שוב?", tools: used });
  } catch (e) {
    S.conv.messages.pop();
    $("#status").textContent = e && e.code === "rate_limited" ? "יותר מדי הודעות ברצף. חכו דקה." : e && e.code === "not_granted" ? "לא אושרה גישה ל-Claude." : "משהו השתבש. נסו שוב.";
  } finally { busy = false; $("#sendBtn").disabled = false; render(); setTimeout(() => { flashId = null; }, 1700); }
}

// ======================= wiring =======================
if (!S.conv) newConversation();
$("#chips").innerHTML = STARTERS.map((s, i) => `<button type="button" data-s="${i}">${esc(s)}</button>`).join("");
$("#chips").onclick = e => { const b = e.target.closest("[data-s]"); if (b) { $("#chatIn").value = STARTERS[+b.dataset.s]; $("#chatIn").focus(); } };
$("#sendForm").onsubmit = e => { e.preventDefault(); send($("#chatIn").value); };
$("#newChat").onclick = () => { newConversation(); render(); };
$("#reset").onclick = () => { S = seed(); newConversation(); render(); };
$("#board").onclick = e => { const b = e.target.closest("[data-deal]"); if (b) { S.selected = b.dataset.deal; render(); } };
$("#panel").addEventListener("click", e => {
  const st = e.target.closest("[data-stage]"); const d = S.deals.find(x => x.id === S.selected);
  if (st && d) { moveStage(d, st.dataset.stage, "user"); rescore(S, d); render(); }
});
$("#panel").addEventListener("change", e => {
  const t = e.target.closest("[data-task]"); if (t) { const task = S.tasks.find(x => x.id === t.dataset.task); if (task) task.done = true; render(); }
});
render();
if (window.claude?.use) samplePromise = window.claude.use("sample");
</script>
</body>
</html>
