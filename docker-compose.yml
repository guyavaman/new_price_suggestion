services:
  db:
    image: pgvector/pgvector:pg16
    container_name: quote-agent-db
    environment:
      POSTGRES_USER: quote
      POSTGRES_PASSWORD: quote
      POSTGRES_DB: quote_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote -d quote_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
